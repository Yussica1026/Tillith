name: Build Tillith Android

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Android package to build'
        type: choice
        options: [both, cloud, embedded]
        default: both
      embedded:
        description: 'Also attempt the full on-device Python core (native wheel compatibility required)'
        type: boolean
        default: true
      smoke:
        description: 'Run the cloud APK in an Android emulator'
        type: boolean
        default: true
      wheel_run_id:
        description: 'Successful Tillith Android Python wheel build run ID'
        type: string
        default: ''
      extra_wheel_run_id:
        description: 'Optional second wheel run for image and crypto dependencies'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.target == 'embedded' && '["embedded"]' || inputs.target == 'cloud' && '["cloud"]' || '["cloud", "embedded"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install and compile mobile interface
        working-directory: mobile
        run: npm ci && npm run android:sync
      - name: Download verified Android Python wheels
        if: matrix.mode == 'embedded' && inputs.embedded && inputs.wheel_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.wheel_run_id }}
          pattern: tillith-cp313-android24-*
          merge-multiple: true
          path: mobile/native-python/wheels
      - name: Download additional Android Python wheels
        if: matrix.mode == 'embedded' && inputs.embedded && inputs.extra_wheel_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.extra_wheel_run_id }}
          pattern: tillith-*
          merge-multiple: true
          path: mobile/native-python/wheels
      - name: Build Android package
        id: build
        working-directory: mobile/android
        env:
          BUILD_MODE: ${{ matrix.mode }}
          BUILD_EMBEDDED: ${{ inputs.embedded }}
        run: |
          if [ "$BUILD_MODE" = embedded ] && [ "$BUILD_EMBEDDED" != true ]; then exit 0; fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PembeddedCore=$([ "$BUILD_MODE" = embedded ] && echo true || echo false)
      - name: Enable emulator acceleration
        if: matrix.mode == 'cloud' && inputs.smoke
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the installed cloud application
        if: matrix.mode == 'cloud' && inputs.smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          working-directory: mobile/android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -PembeddedCore=false
      - name: Save emulator test results
        if: always() && matrix.mode == 'cloud' && inputs.smoke
        uses: actions/upload-artifact@v4
        with:
          name: tillith-android-smoke
          path: |
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.conclusion == 'success' && (matrix.mode == 'cloud' || inputs.embedded)
        with:
          name: tillith-${{ matrix.mode }}-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
