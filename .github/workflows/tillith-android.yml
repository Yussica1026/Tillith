name: Build Tillith Android

on:
  workflow_dispatch:
    inputs:
      embedded:
        description: 'Also attempt the full on-device Python core (native wheel compatibility required)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [cloud, embedded]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
      - name: Install and compile mobile interface
        working-directory: mobile
        run: npm ci && npm run android:sync
      - name: Build Android package
        working-directory: mobile/android
        env:
          BUILD_MODE: ${{ matrix.mode }}
          BUILD_EMBEDDED: ${{ inputs.embedded }}
        run: |
          if [ "$BUILD_MODE" = embedded ] && [ "$BUILD_EMBEDDED" != true ]; then exit 0; fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PembeddedCore=$([ "$BUILD_MODE" = embedded ] && echo true || echo false)
      - uses: actions/upload-artifact@v4
        if: success() && (matrix.mode == 'cloud' || inputs.embedded)
        with:
          name: tillith-${{ matrix.mode }}-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
