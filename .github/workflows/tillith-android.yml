name: Build Tillith Android

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Android package to build'
        type: choice
        options: [both, cloud, embedded]
        default: both
      embedded:
        description: 'Also attempt the full on-device Python core (native wheel compatibility required)'
        type: boolean
        default: true
      smoke:
        description: 'Run the cloud APK in an Android emulator'
        type: boolean
        default: true
      wheel_run_id:
        description: 'Successful Tillith Android Python wheel build run ID'
        type: string
        default: ''
      extra_wheel_run_id:
        description: 'Optional second wheel run for image and crypto dependencies'
        type: string
        default: ''
      embedded_abis:
        description: 'Embedded core CPU architectures'
        type: choice
        options: ['arm64-v8a,x86_64', 'arm64-v8a']
        default: 'arm64-v8a,x86_64'

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.target == 'embedded' && '["embedded"]' || inputs.target == 'cloud' && '["cloud"]' || '["cloud", "embedded"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install and compile mobile interface
        working-directory: mobile
        run: npm ci && npm run android:sync
      - name: Download verified Android Python wheels
        if: matrix.mode == 'embedded' && inputs.embedded && inputs.wheel_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.wheel_run_id }}
          pattern: tillith-cp313-android24-*
          merge-multiple: true
          path: mobile/native-python/wheels
      - name: Download additional Android Python wheels
        if: matrix.mode == 'embedded' && inputs.embedded && inputs.extra_wheel_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.extra_wheel_run_id }}
          pattern: tillith-*
          merge-multiple: true
          path: mobile/native-python/wheels
      - name: Build Android package
        id: build
        working-directory: mobile/android
        env:
          BUILD_MODE: ${{ matrix.mode }}
          BUILD_EMBEDDED: ${{ inputs.embedded }}
          EMBEDDED_ABIS: ${{ inputs.embedded_abis }}
        run: |
          if [ "$BUILD_MODE" = embedded ] && [ "$BUILD_EMBEDDED" != true ]; then exit 0; fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PembeddedCore=$([ "$BUILD_MODE" = embedded ] && echo true || echo false) \
            -PembeddedAbis="${EMBEDDED_ABIS:-arm64-v8a,x86_64}" \
            -PtillithVersionCode="$GITHUB_RUN_NUMBER"
      - name: Sign and verify release with the fixed Tillith certificate
        if: matrix.mode == 'cloud' || inputs.embedded
        working-directory: mobile/android
        env:
          TILLITH_KEYSTORE_BASE64: ${{ secrets.TILLITH_ANDROID_KEYSTORE_BASE64 }}
          TILLITH_KEYSTORE_PASSWORD: ${{ secrets.TILLITH_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TILLITH_KEYSTORE_BASE64"
          test -n "$TILLITH_KEYSTORE_PASSWORD"
          umask 077
          keystore="$RUNNER_TEMP/tillith-release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$TILLITH_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          output=app/build/outputs/apk/release
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign --ks "$keystore" --ks-type PKCS12 \
            --ks-key-alias tillith-release --ks-pass env:TILLITH_KEYSTORE_PASSWORD \
            --out "$output/tillith-release.apk" "$output/app-release-unsigned.apk"
          "$signer" verify --verbose --print-certs "$output/tillith-release.apk" | tee "$output/signing-report.txt"
          sha256sum "$output/tillith-release.apk" > "$output/apk.sha256"
          printf '%s\n' "$GITHUB_SHA" > "$output/source-commit.txt"
      - name: Enable emulator acceleration
        if: matrix.mode == 'cloud' && inputs.smoke
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the installed cloud application
        if: matrix.mode == 'cloud' && inputs.smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          working-directory: mobile/android
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -PembeddedCore=false
            adb uninstall app.tillith.privatechat
            adb install app/build/outputs/apk/release/tillith-release.apk
            adb shell am start -W -n app.tillith.privatechat/.MainActivity
            sleep 5
            adb shell pidof app.tillith.privatechat
            adb shell uiautomator dump /sdcard/tillith-release-window.xml
            adb pull /sdcard/tillith-release-window.xml app/build/reports/tillith-release-window.xml
            adb shell screencap -p /sdcard/tillith-release.png
            adb pull /sdcard/tillith-release.png app/build/reports/tillith-release.png
      - name: Save emulator test results
        if: always() && matrix.mode == 'cloud' && inputs.smoke
        uses: actions/upload-artifact@v4
        with:
          name: tillith-android-smoke
          path: |
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
            mobile/android/app/build/reports/tillith-release-window.xml
            mobile/android/app/build/reports/tillith-release.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.conclusion == 'success' && (matrix.mode == 'cloud' || inputs.embedded)
        with:
          name: tillith-${{ matrix.mode }}-release
          path: |
            mobile/android/app/build/outputs/apk/release/tillith-release.apk
            mobile/android/app/build/outputs/apk/release/signing-report.txt
            mobile/android/app/build/outputs/apk/release/apk.sha256
            mobile/android/app/build/outputs/apk/release/source-commit.txt
          if-no-files-found: error
          retention-days: 7
