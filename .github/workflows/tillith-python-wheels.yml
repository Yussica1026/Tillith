name: Build Tillith Android Python wheels

on:
  workflow_dispatch:
    inputs:
      package:
        description: Packages to build (native adds Pillow and cryptography only)
        type: choice
        default: all
        options: [all, rust, native, pillow, cryptography, pure]
      abi:
        description: Android ABI (select one to retry only that target)
        type: choice
        default: all
        options: [all, arm64_v8a, x86_64]

permissions:
  contents: read

jobs:
  wheels:
    if: inputs.package != 'pure'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.package == 'rust' && '["pydantic-core","jiter"]' || inputs.package == 'native' && '["pillow","cryptography"]' || inputs.package == 'pillow' && '["pillow"]' || inputs.package == 'cryptography' && '["cryptography"]' || '["pydantic-core","jiter","pillow","cryptography"]') }}
        abi: ${{ fromJSON(inputs.abi == 'arm64_v8a' && '["arm64_v8a"]' || inputs.abi == 'x86_64' && '["x86_64"]' || '["arm64_v8a","x86_64"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install fixed wheel builder and Rust targets
        run: |
          python -m pip install cibuildwheel==4.3.4
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Build, test on Android where supported, and inspect ELF
        env:
          WHEEL_PACKAGE: ${{ matrix.package }}
          WHEEL_ABI: ${{ matrix.abi }}
        run: |
          python mobile/native-python/build_wheels.py \
            --package "$WHEEL_PACKAGE" --abi "$WHEEL_ABI" \
            --work-dir "$RUNNER_TEMP/tillith-wheel-work" \
            --output-dir "$RUNNER_TEMP/tillith-wheel-artifact"
      - uses: actions/upload-artifact@v7
        with:
          name: tillith-cp313-android24-${{ matrix.package }}-${{ matrix.abi }}
          path: ${{ runner.temp }}/tillith-wheel-artifact/
          if-no-files-found: error
          retention-days: 14
  pure-python:
    if: inputs.package == 'all' || inputs.package == 'pure' || inputs.package == 'native'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build and verify platform-independent source packages
        run: |
          python -m pip install packaging==26.3
          python mobile/native-python/build_wheels.py \
            --package jieba --abi arm64_v8a \
            --work-dir "$RUNNER_TEMP/tillith-pure-work" \
            --output-dir "$RUNNER_TEMP/tillith-pure-artifact"
      - uses: actions/upload-artifact@v7
        with:
          name: tillith-py3-none-any
          path: ${{ runner.temp }}/tillith-pure-artifact/
          if-no-files-found: error
          retention-days: 14
